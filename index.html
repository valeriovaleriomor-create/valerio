<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestionale Trasferte - Accesso remoto</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
  :root {
    --verde: #7C9A2E;
    --verde-scuro: #5f7823;
    --sfondo: #f4f5f7;
    --bordo: #e2e6ea;
    --testo: #1f2430;
    --testo-secondario: #6b7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--sfondo); color: var(--testo); padding-bottom: 40px;
  }
  header {
    background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  header .titolo { font-weight: 700; font-size: 16px; }
  header button {
    background: transparent; border: 1px solid #444; color: #ccc; padding: 6px 10px;
    border-radius: 6px; font-size: 12px;
  }
  .schermata { padding: 14px; max-width: 560px; margin: 0 auto; }
  .centro { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; gap: 14px; padding: 20px; }
  .btn {
    background: var(--verde); color: #fff; border: none; padding: 12px 20px; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:active { background: var(--verde-scuro); }
  .btn.secondario { background: #fff; color: var(--testo); border: 1px solid var(--bordo); }
  .btn.piccolo { padding: 7px 12px; font-size: 13px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--bordo); border-radius: 8px;
    font-size: 15px; background: #fff; color: var(--testo); margin-top: 4px;
  }
  label { font-size: 12px; font-weight: 600; color: var(--testo-secondario); display: block; margin-top: 12px; }
  .campo { margin-bottom: 6px; }
  .card {
    background: #fff; border: 1px solid var(--bordo); border-radius: 10px; padding: 14px;
    margin-bottom: 10px;
  }
  .card:active { background: #fafafa; }
  .card .nome { font-weight: 700; font-size: 15px; }
  .card .dettaglio { font-size: 12.5px; color: var(--testo-secondario); margin-top: 3px; }
  .ricerca { margin-bottom: 14px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: #eef2e5; color: var(--verde-scuro); font-weight: 600; margin-left: 6px;
  }
  .badge.consegnata { background: #dcfce7; color: #166534; }
  .badge.dacons { background: #fef3c7; color: #92400e; }
  .toolbar-back { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar-back .btn.secondario { padding: 6px 10px; }
  .errore { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .successo { background: #f0f7e8; border: 1px solid #c5e0a0; color: #3f5a13; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .spinner { border: 3px solid #eee; border-top-color: var(--verde); border-radius: 50%; width: 30px; height: 30px; animation: girare 0.8s linear infinite; }
  @keyframes girare { to { transform: rotate(360deg); } }
  .impostazioni-link { font-size: 12px; color: var(--testo-secondario); text-decoration: underline; margin-top: 20px; }
  .sezione-titolo { font-weight: 700; font-size: 14px; margin: 18px 0 8px; }
  .toggle-riga { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--bordo); }
  .toggle-riga:last-child { border-bottom: none; }
</style>
</head>
<body>

<header>
  <div class="titolo">📋 Gestionale Trasferte</div>
  <button id="btnMenu" style="display:none">⚙️</button>
</header>

<div id="app" class="schermata"></div>

<script>
// ============ CONFIGURAZIONE ============
// Da compilare dopo la registrazione app su Azure Portal (vedi istruzioni ricevute)
const MSAL_CONFIG = {
  auth: {
    clientId: "7f035ccf-4172-4710-8983-546c0f214b99",
    authority: "https://login.microsoftonline.com/common",
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: "localStorage" },
};
const SCOPES = ["Files.ReadWrite", "User.Read"];
const NOME_FILE_SYNC = "gestionale_sync.json";

// ============ STATO ============
let msalInstance = null;
let account = null;
let dati = { clienti: [], pratiche: [] };
let nomeCartellaOneDrive = localStorage.getItem("gt_cartella_onedrive") || "";
let vistaCorrente = { tipo: "login" };

const app = document.getElementById("app");
const btnMenu = document.getElementById("btnMenu");

// ============ AUTENTICAZIONE ============
async function inizializza() {
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  const risposta = await msalInstance.handleRedirectPromise().catch(() => null);
  const account_esistente = msalInstance.getAllAccounts()[0];
  if (risposta?.account) account = risposta.account;
  else if (account_esistente) account = account_esistente;

  if (account) {
    if (!nomeCartellaOneDrive) {
      vistaCorrente = { tipo: "impostazioniIniziali" };
      disegna();
    } else {
      await caricaDati();
    }
  } else {
    vistaCorrente = { tipo: "login" };
    disegna();
  }
}

async function accedi() {
  await msalInstance.loginRedirect({ scopes: SCOPES });
}

async function ottieniToken() {
  try {
    const risultato = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account });
    return risultato.accessToken;
  } catch (err) {
    await msalInstance.acquireTokenRedirect({ scopes: SCOPES });
    return null;
  }
}

function esci() {
  msalInstance.logoutRedirect();
}

// ============ LETTURA/SCRITTURA DATI (Microsoft Graph) ============
async function caricaDati() {
  vistaCorrente = { tipo: "caricamento" };
  disegna();
  const token = await ottieniToken();
  if (!token) return;
  try {
    const percorso = `/me/drive/root:/${encodeURIComponent(nomeCartellaOneDrive)}/${NOME_FILE_SYNC}:/content`;
    const res = await fetch(`https://graph.microsoft.com/v1.0${percorso}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (res.status === 404) {
      vistaCorrente = { tipo: "erroreFile" };
      disegna();
      return;
    }
    if (!res.ok) throw new Error(`Errore ${res.status} nel leggere il file da OneDrive`);
    dati = await res.json();
    dati.clienti = dati.clienti || [];
    dati.pratiche = dati.pratiche || [];
    btnMenu.style.display = "inline-block";
    vistaCorrente = { tipo: "listaClienti" };
    disegna();
  } catch (err) {
    vistaCorrente = { tipo: "erroreGenerico", messaggio: err.message };
    disegna();
  }
}

async function salvaDati() {
  const token = await ottieniToken();
  if (!token) return false;
  dati.ultimaModifica = new Date().toISOString();
  dati.origine = "web";
  try {
    const percorso = `/me/drive/root:/${encodeURIComponent(nomeCartellaOneDrive)}/${NOME_FILE_SYNC}:/content`;
    const res = await fetch(`https://graph.microsoft.com/v1.0${percorso}`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(dati),
    });
    if (!res.ok) throw new Error(`Errore ${res.status} nel salvare su OneDrive`);
    return true;
  } catch (err) {
    alert("Errore nel salvataggio: " + err.message);
    return false;
  }
}

// ============ NAVIGAZIONE ============
function vai(vista) { vistaCorrente = vista; disegna(); window.scrollTo(0, 0); }

// ============ DISEGNO SCHERMATE ============
function disegna() {
  const v = vistaCorrente;
  if (v.tipo === "login") return disegnaLogin();
  if (v.tipo === "impostazioniIniziali") return disegnaImpostazioniIniziali();
  if (v.tipo === "caricamento") return disegnaCaricamento();
  if (v.tipo === "erroreFile") return disegnaErroreFile();
  if (v.tipo === "erroreGenerico") return disegnaErroreGenerico(v.messaggio);
  if (v.tipo === "listaClienti") return disegnaListaClienti();
  if (v.tipo === "dettaglioCliente") return disegnaDettaglioCliente(v.clienteId);
  if (v.tipo === "dettaglioTrasferta") return disegnaDettaglioTrasferta(v.praticaId);
  if (v.tipo === "menu") return disegnaMenu();
}

function disegnaLogin() {
  app.innerHTML = `
    <div class="centro">
      <div style="font-size:40px">📋</div>
      <h2 style="margin:0">Gestionale Trasferte</h2>
      <p style="color:var(--testo-secondario);font-size:14px;max-width:320px">
        Consulta e aggiorna clienti e trasferte da qui. Accedi con lo stesso account Microsoft che usi in ufficio.
      </p>
      <button class="btn" onclick="accedi()">Accedi con Microsoft</button>
    </div>`;
}

function disegnaImpostazioniIniziali() {
  app.innerHTML = `
    <div class="centro">
      <h3 style="margin:0">Ultimo passaggio</h3>
      <p style="color:var(--testo-secondario);font-size:14px;max-width:320px">
        Scrivi il nome della cartella che hai scelto anche nell'app del PC (Impostazioni → Accesso remoto).
        Deve essere identico.
      </p>
      <input id="inputCartella" placeholder="es. GestionaleTrasferte" style="max-width:280px" />
      <button class="btn" onclick="salvaCartellaIniziale()">Continua</button>
    </div>`;
}
function salvaCartellaIniziale() {
  const val = document.getElementById("inputCartella").value.trim();
  if (!val) return;
  nomeCartellaOneDrive = val;
  localStorage.setItem("gt_cartella_onedrive", val);
  caricaDati();
}

function disegnaCaricamento() {
  app.innerHTML = `<div class="centro"><div class="spinner"></div><div style="color:var(--testo-secondario)">Carico i dati da OneDrive…</div></div>`;
}

function disegnaErroreFile() {
  app.innerHTML = `
    <div class="centro">
      <div class="errore" style="max-width:320px">Nessun file trovato in OneDrive nella cartella "${escapeHtml(nomeCartellaOneDrive)}".<br/><br/>Apri l'app sul PC almeno una volta con la sincronizzazione impostata: creerà lei il file iniziale.</div>
      <button class="btn secondario" onclick="caricaDati()">Riprova</button>
    </div>`;
}

function disegnaErroreGenerico(msg) {
  app.innerHTML = `
    <div class="centro">
      <div class="errore" style="max-width:320px">⚠️ ${escapeHtml(msg)}</div>
      <button class="btn secondario" onclick="caricaDati()">Riprova</button>
    </div>`;
}

function disegnaMenu() {
  app.innerHTML = `
    <div class="toolbar-back"><button class="btn secondario piccolo" onclick="vai({tipo:'listaClienti'})">← Indietro</button></div>
    <div class="card"><div class="nome">${escapeHtml(account?.name || account?.username || "")}</div>
    <div class="dettaglio">${escapeHtml(account?.username || "")}</div></div>
    <button class="btn secondario" style="width:100%;margin-top:10px" onclick="esci()">Esci</button>
    <div style="text-align:center"><a class="impostazioni-link" href="#" onclick="cambiaCartella();return false;">Cambia cartella OneDrive</a></div>
  `;
}
function cambiaCartella() {
  localStorage.removeItem("gt_cartella_onedrive");
  nomeCartellaOneDrive = "";
  vai({ tipo: "impostazioniIniziali" });
}
btnMenu.onclick = () => vai({ tipo: "menu" });

function disegnaListaClienti() {
  app.innerHTML = `
    <div class="ricerca"><input id="ricercaCliente" placeholder="🔍 Cerca cliente, città o commessa…" oninput="filtraClienti(this.value)" /></div>
    <div id="listaClientiBox"></div>
  `;
  filtraClienti("");
}
function filtraClienti(filtro) {
  const f = filtro.toLowerCase().trim();
  const risultati = dati.clienti
    .filter(c => !f || (c.ragioneSociale || "").toLowerCase().includes(f) || (c.citta || "").toLowerCase().includes(f) || (c.commesseNote || []).some(cm => String(cm).toLowerCase().includes(f)))
    .sort((a, b) => (a.ragioneSociale || "").localeCompare(b.ragioneSociale || ""));
  const box = document.getElementById("listaClientiBox");
  if (!risultati.length) { box.innerHTML = `<div style="text-align:center;color:var(--testo-secondario);padding:30px 0">Nessun cliente trovato</div>`; return; }
  box.innerHTML = risultati.map(c => {
    const nTrasferte = dati.pratiche.filter(p => p.clienteId === c.id).length;
    return `<div class="card" onclick="vai({tipo:'dettaglioCliente', clienteId:'${c.id}'})">
      <div class="nome">${escapeHtml(c.ragioneSociale)}</div>
      <div class="dettaglio">${escapeHtml(c.indirizzo || "—")}</div>
      <div class="dettaglio">${nTrasferte} trasferta/e</div>
    </div>`;
  }).join("");
}

function disegnaDettaglioCliente(clienteId) {
  const c = dati.clienti.find(x => x.id === clienteId);
  if (!c) return vai({ tipo: "listaClienti" });
  const pratiche = dati.pratiche.filter(p => p.clienteId === clienteId)
    .sort((a, b) => (b.comune?.dataDa || "").localeCompare(a.comune?.dataDa || ""));
  app.innerHTML = `
    <div class="toolbar-back"><button class="btn secondario piccolo" onclick="vai({tipo:'listaClienti'})">← Clienti</button></div>
    <h2 style="margin:0 0 4px">${escapeHtml(c.ragioneSociale)}</h2>
    <div style="color:var(--testo-secondario);font-size:13px;margin-bottom:16px">${escapeHtml(c.indirizzo || "")}${c.referente ? " · " + escapeHtml(c.referente) : ""}${c.telefono ? " · " + escapeHtml(c.telefono) : ""}</div>
    <div class="sezione-titolo">Trasferte</div>
    ${pratiche.length === 0 ? `<div style="color:var(--testo-secondario);font-size:13px">Nessuna trasferta registrata.</div>` : pratiche.map(p => {
      const consegnata = p.notaSpese?.consegnata;
      return `<div class="card" onclick="vai({tipo:'dettaglioTrasferta', praticaId:'${p.id}'})">
        <div class="nome">${escapeHtml(p.comune?.commessa || "—")} <span class="dettaglio">${escapeHtml(p.comune?.numeroOS || "")}</span></div>
        <div class="dettaglio">${fmtDataBreve(p.comune?.dataDa)} – ${fmtDataBreve(p.comune?.dataA)}</div>
        ${p.documenti?.notaSpese ? `<span class="badge ${consegnata ? "consegnata" : "dacons"}">${consegnata ? "✅ Nota spese consegnata" : "⏳ Da consegnare"}</span>` : ""}
      </div>`;
    }).join("")}
  `;
}

function disegnaDettaglioTrasferta(praticaId) {
  const p = dati.pratiche.find(x => x.id === praticaId);
  if (!p) return vai({ tipo: "listaClienti" });
  const c = dati.clienti.find(x => x.id === p.clienteId);
  app.innerHTML = `
    <div class="toolbar-back"><button class="btn secondario piccolo" onclick="vai({tipo:'dettaglioCliente', clienteId:'${p.clienteId}'})">← ${escapeHtml(c?.ragioneSociale || "Cliente")}</button></div>
    <h2 style="margin:0 0 14px">${escapeHtml(p.comune?.commessa || "—")}</h2>

    <div class="campo"><label>Numero OS</label><input id="f_numeroOS" value="${escapeHtml(p.comune?.numeroOS || "")}" /></div>
    <div class="campo"><label>Data inizio</label><input id="f_dataDa" type="date" value="${p.comune?.dataDa || ""}" /></div>
    <div class="campo"><label>Data fine</label><input id="f_dataA" type="date" value="${p.comune?.dataA || ""}" /></div>

    ${p.documenti?.notaSpese ? `
    <div class="sezione-titolo">Nota Spese</div>
    <div class="toggle-riga">
      <span>Consegnata in amministrazione</span>
      <input type="checkbox" id="f_consegnata" ${p.notaSpese.consegnata ? "checked" : ""} style="width:22px;height:22px;margin:0" />
    </div>
    ${p.notaSpese.dataConsegna ? `<div class="dettaglio" style="margin-top:-6px">Consegnata il ${new Date(p.notaSpese.dataConsegna).toLocaleString("it-IT")}</div>` : ""}
    ` : ""}

    <div class="campo" style="margin-top:16px"><label>Note</label><textarea id="f_note" rows="3">${escapeHtml(p.note || "")}</textarea></div>

    <button class="btn" style="width:100%;margin-top:20px" onclick="salvaTrasferta('${p.id}')">💾 Salva modifiche</button>
    <div id="esitoSalvataggio"></div>
  `;
}

async function salvaTrasferta(praticaId) {
  const p = dati.pratiche.find(x => x.id === praticaId);
  if (!p) return;
  p.comune.numeroOS = document.getElementById("f_numeroOS").value.trim();
  p.comune.dataDa = document.getElementById("f_dataDa").value;
  p.comune.dataA = document.getElementById("f_dataA").value;
  p.note = document.getElementById("f_note").value;
  if (p.documenti?.notaSpese) {
    const consegnataNuovo = document.getElementById("f_consegnata").checked;
    if (consegnataNuovo && !p.notaSpese.consegnata) p.notaSpese.dataConsegna = new Date().toISOString();
    if (!consegnataNuovo) p.notaSpese.dataConsegna = "";
    p.notaSpese.consegnata = consegnataNuovo;
  }
  const box = document.getElementById("esitoSalvataggio");
  box.innerHTML = `<div class="centro" style="min-height:auto;padding:14px"><div class="spinner"></div></div>`;
  const ok = await salvaDati();
  box.innerHTML = ok
    ? `<div class="successo" style="margin-top:12px">✅ Salvato su OneDrive</div>`
    : `<div class="errore" style="margin-top:12px">⚠️ Salvataggio non riuscito, riprova</div>`;
}

// ============ UTILITY ============
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function fmtDataBreve(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

inizializza();
</script>
</body>
</html>
